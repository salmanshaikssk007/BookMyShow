spring:
  profiles:
    active: dev

  application:
    name: BookMyShow

  datasource:
    url: jdbc:postgresql://localhost:5432/bookmyshow
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false

server:
  port: 8080
  servlet:
    context-path: /

app:
  jwt:
    secret: bXlTdXBlclNlY3JldEtleUZvckJvb2tNeVNob3dBcHBsaWNhdGlvbjEyMzQ1Njc4
    expiration-ms: 86400000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    com.example.BookMyShow: DEBUG