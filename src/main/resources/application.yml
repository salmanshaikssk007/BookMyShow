spring:
  application:
    name: BookMyShow

  datasource:
    url: jdbc:postgresql://localhost:5432/BookMyShow
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update       # validate | update | create | create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  redis:
    host: localhost
    port: 6379

server:
  port: 8080
  servlet:
    context-path: /api