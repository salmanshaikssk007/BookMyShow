services:
  postgres:
    image: postgres:15
    container_name: bms-postgres
    environment:
      POSTGRES_DB: bookmyshow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - bms-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: bms-redis
    ports:
      - "6379:6379"

volumes:
  bms-postgres-data: